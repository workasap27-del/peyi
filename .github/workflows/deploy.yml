name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le déploiement Vercel (preview + production) est géré par l'intégration
# GitHub native de Vercel (voir le commentaire du bot Vercel sur chaque PR),
# pas par ce workflow — inutile de dupliquer avec un vercel-token.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
